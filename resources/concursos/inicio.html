<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Início — Estudo para Concursos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
/* Início: o que fazer hoje, quanto falta para a prova e como você está indo. Mesmas cores do resto do site;
   a Literata (a fonte do caderno de flashcards e das regras) só na contagem regressiva. */
:root{
 --pri:#5b3fd0;--pri-l:#e7e3f8;--bg:#f4f4f7;--card:#fff;--tx:#2b2b33;--mut:#6b6b78;--faint:#a3a3ad;--line:#e6e6ec;--track:#ececf1;
 --ok:#0f7a55;--ok-l:#e3f5ed;--no:#b5352a;--no-l:#fbe9e7;--mid:#9a6512;--mid-l:#fdf3e1;
 --serif:Literata,Georgia,"Times New Roman",serif;
 --gap:1rem;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,"Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}

/* Em telas grandes a página cabe na janela; os painéis de listas rolam por dentro. */
body{height:100dvh;display:flex;flex-direction:column}
main{flex:1;min-height:0;width:100%;max-width:112rem;margin:0 auto;padding:1.25rem 2rem 1rem;
 display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:var(--gap)}

/* ---------- topo: contagem regressiva, dias de estudo e quanto já respondeu ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(24rem,1fr) minmax(18rem,.8fr);gap:1rem 3rem;align-items:end}
.prova h1{margin:0;font-family:var(--serif);font-weight:600;font-size:2.375rem;line-height:1.1;letter-spacing:-.01em}
.prova p{margin:.5rem 0 0;font-size:.9375rem;color:var(--mut);max-width:40rem}
.prova p b{color:var(--tx);font-variant-numeric:tabular-nums}
.prova p .ok{color:var(--ok)}.prova p .no{color:var(--no)}
.prova p a{color:var(--pri)}

/* Por dia: números de hoje + colunas dos últimos 14 dias (acertos, erros e flashcards lado a lado). */
.daily{font-size:.8125rem;color:var(--mut)}
.daily-top{margin:0 0 .5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daily-top b{color:var(--tx);font-variant-numeric:tabular-nums}
.daily-top .ok{color:var(--ok)}.daily-top .no{color:var(--no)}.daily-top .fl{color:var(--pri)}
.daily-top .nw{white-space:nowrap}
.daily-top a{color:var(--pri)}
.cols,.daily-key{--d-ok:#2f9e72;--d-no:#c0392b;--d-fl:#9b8ae0}
.cols{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;align-items:end;height:5rem;border-bottom:1px solid var(--line)}
.col{display:flex;align-items:flex-end;gap:1px;height:100%;padding:0 1px;border-radius:3px 3px 0 0;cursor:default}
.col i{display:block;flex:1;min-width:0;border-radius:2px 2px 0 0}
.col .a{background:var(--d-ok)}.col .e{background:var(--d-no)}.col .f{background:var(--d-fl)}
.col.vazio{position:relative}
.col.vazio::after{content:"";position:absolute;left:1px;right:1px;bottom:0;height:2px;background:var(--line)}
.col.hoje{background:#efedfb}
.col:hover{background:#e7e4f7}
.cols-x{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.75rem;color:var(--faint);margin-top:.25rem}
.daily-key{display:flex;gap:.75rem;font-size:.75rem}
.daily-key span{display:flex;align-items:center;gap:.25rem}
.daily-key i{width:.5rem;height:.5rem;border-radius:2px;background:var(--d-ok)}
.daily-key i.e{background:var(--d-no)}.daily-key i.f{background:var(--d-fl)}
.daily-more{margin:.25rem 0 0;font-size:.75rem;color:var(--faint);text-align:center}
.importar{border:0;background:none;padding:0;font:inherit;font-size:.75rem;font-weight:600;color:var(--pri);cursor:pointer;text-decoration:underline}

.cover{font-size:.875rem;color:var(--mut)}
.cover p{margin:0 0 .5rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.25rem 1rem}
.cover b{color:var(--tx);font-variant-numeric:tabular-nums}
.cover .ok{color:var(--ok)}.cover .no{color:var(--no)}
.track{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.track i{display:block;height:100%;background:var(--pri);border-radius:inherit}

/* ---------- Para hoje: uma régua com as tarefas do dia; cada uma leva à página ---------- */
.hoje-faixa{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hoje-faixa h2{margin:0;padding:.875rem 1.25rem;font-size:1rem;font-weight:700;display:flex;align-items:center;border-right:1px solid var(--line);background:#faf9fe;color:var(--pri)}
.tarefa{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:.75rem;align-content:center;padding:.75rem 1.25rem .875rem;color:inherit;text-decoration:none;border-left:1px solid var(--line)}
.tarefa:nth-child(2){border-left:0}
.tarefa::before{content:"";position:absolute;left:0;top:.875rem;bottom:.875rem;width:3px;border-radius:0 3px 3px 0;background:var(--cor)}
.tarefa:hover{background:#faf9fe}
.tarefa:hover .t-o{text-decoration:underline}
.t-n{grid-row:1/3;align-self:center;font-size:2rem;font-weight:700;line-height:1;color:var(--cor);font-variant-numeric:tabular-nums;min-width:2.5ch}
.t-o{font-weight:600;font-size:.9375rem;align-self:end}
.t-d{font-size:.8125rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tarefa.feito .t-n{color:var(--ok)}

/* ---------- painéis: O que revisar em duas colunas; Simulados e Por área na altura toda ---------- */
.board{display:grid;gap:var(--gap);min-height:0;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:auto minmax(0,1fr);
 grid-template-areas:"rv rv sim area" "lom ed sim area"}
#revisar{grid-area:rv;min-height:0}
.p-lom{grid-area:lom}.p-ed{grid-area:ed}.p-sim{grid-area:sim}.p-area{grid-area:area}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;padding:.875rem 1.125rem .5rem}
.ph h2{margin:0;font-size:1rem;font-weight:700}
.ph p{margin:.125rem 0 0;font-size:.8125rem;color:var(--mut)}
.ph a,.ph button{flex:none;border:0;background:none;padding:0;font-size:.8125rem;font-weight:600;color:var(--pri);text-decoration:none;cursor:pointer}
.ph a:hover,.ph button:hover{text-decoration:underline}
.rows{flex:1;min-height:0;overflow:auto;padding:0 .5rem .5rem;scrollbar-width:thin}

/* Uma linha por item: nome, barra de quanto já fez, contagem e aproveitamento. */
.r{display:grid;grid-template-columns:minmax(0,1fr) 4rem 3.25rem 2.75rem;align-items:center;column-gap:.75rem;
 min-height:2rem;padding:.25rem .625rem;border-radius:6px;font-size:.875rem;width:100%;border:0;background:none;text-align:left}
.r:nth-child(even){background:#f8f8fa}
.r-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sub{grid-column:1/-1;font-size:.75rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-.125rem}
.r-bar{height:4px;border-radius:99px;background:var(--track);overflow:hidden}
.r-bar i{display:block;height:100%;background:var(--pri);border-radius:inherit}
.r-n{text-align:right;color:var(--mut);font-size:.8125rem;font-variant-numeric:tabular-nums}
.r-s{text-align:right;font-weight:700;font-size:.8125rem;font-variant-numeric:tabular-nums}
.r-s.ok{color:var(--ok)}.r-s.mid{color:var(--mid)}.r-s.no{color:var(--no)}
.r.idle .r-name{color:var(--mut)}
.r.idle .r-s{color:var(--faint);font-weight:400}
.r.full .r-bar i{background:var(--ok)}
.r .lead{font-weight:600;color:var(--pri)}
button.r{cursor:pointer;font:inherit;color:inherit}
button.r:hover{background:var(--pri-l)}
button.r:hover .r-name{color:var(--pri)}

.foot{margin:0;font-size:.75rem;color:var(--mut)}

/* Janelas menores: fluxo normal, com rolagem da página. */
@media (max-width:1280px){.hero{grid-template-columns:1fr 1fr}.prova{grid-column:1/-1}
 .hoje-faixa{grid-template-columns:repeat(2,minmax(0,1fr))}.hoje-faixa h2{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--line)}
 .tarefa:nth-child(4){border-left:0}.tarefa:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:1280px),(max-height:760px){
 body{height:auto}
 main{flex:none}
 .rows{overflow:visible}
 .board{grid-template-columns:1fr 1fr;grid-template-rows:auto;grid-template-areas:"rv rv" "lom ed" "sim area"}
}
@media (max-width:760px){
 main{padding:1rem}
 .hero{grid-template-columns:1fr}
 .prova h1{font-size:1.75rem}
 .hoje-faixa{grid-template-columns:1fr}.tarefa{border-left:0;border-top:1px solid var(--line)}
 .board{grid-template-columns:1fr;grid-template-areas:"rv" "lom" "ed" "sim" "area"}
 .r{grid-template-columns:minmax(0,1fr) 2.75rem 3rem 2.5rem;column-gap:.5rem}
}
</style>
<link rel="stylesheet" href="css/edital.css">
<link rel="stylesheet" href="css/nav.css">
</head>
<body>
<script src="js/armazenamento.js"></script>
<script src="js/config.js"></script>
<script src="js/nav.js"></script>
<main>
<header class="hero">
 <div class="prova"><h1 id="headline">Seu desempenho</h1><p id="desempenho"></p></div>
 <div class="daily" id="daily" aria-labelledby="dailyTitle"></div>
 <div class="cover" id="cover"></div>
</header>

<section class="hoje-faixa" aria-labelledby="hHoje">
 <h2 id="hHoje">Para hoje</h2>
 <a class="tarefa" id="tFc" href="flashcards.html" style="--cor:#7b61e0"></a>
 <a class="tarefa" id="tRf" href="refazer.html" style="--cor:#c0392b"></a>
 <a class="tarefa" id="tSim" href="simulados.html" style="--cor:#5b3fd0"></a>
 <a class="tarefa" id="tLom" href="caderno.html" style="--cor:#9a6512"></a>
</section>

<div class="board">
 <section id="revisar" aria-label="O que revisar"></section>
 <section class="panel p-lom" aria-labelledby="hLom">
  <div class="ph"><div><h2 id="hLom">Caderno</h2><p id="lomHint"></p></div><a href="caderno.html">Abrir</a></div>
  <div class="rows" id="lomRows"></div>
 </section>
 <section class="panel p-ed" aria-labelledby="hEd">
  <div class="ph"><div><h2 id="hEd">Edital verticalizado</h2><p id="edHint"></p></div><button type="button" id="openEdital2" aria-haspopup="dialog">Abrir</button></div>
  <div class="rows" id="edRows"></div>
 </section>
 <section class="panel p-sim" aria-labelledby="hSim">
  <div class="ph"><div><h2 id="hSim">Simulados</h2><p id="simHint"></p></div><a href="simulados.html">Abrir</a></div>
  <div class="rows" id="simRows"></div>
 </section>
 <section class="panel p-area" aria-labelledby="hArea">
  <div class="ph"><div><h2 id="hArea">Por área dos simulados</h2><p>Do menor para o maior aproveitamento</p></div></div>
  <div class="rows" id="areaRows"></div>
 </section>
</div>
<p class="foot" id="foot"></p>
</main>
<script src="js/carregar.js"></script>
<script src="js/historico.js"></script>
<script src="js/revisar.js"></script>
<script src="js/edital.js"></script>
<script type="module" src="js/inicio.js"></script>
</body>
</html>
